name = "Solvers"
uuid = "11111111-1111-1111-1111-111111111111"
version = "1.2.3"

[deps]
Light = "22222222-2222-2222-2222-222222222222"

[weakdeps]
Heavy = "33333333-3333-3333-3333-333333333333"
Helper = "55555555-5555-5555-5555-555555555555"

[subpackages]
Common = []
Tsit5 = ["Common"]
BDF = { deps = ["Common", "Heavy"] }
# autoload = true: triggers are Heavy, inherited from sibling BDF
Plots = { deps = ["BDF"], autoload = true }
# list form: trigger on Heavy only, and load Helper itself
Recipes = { deps = ["Common", "Heavy", "Helper"], autoload = ["Heavy"] }
# autoload = true with Helper: only fires once Helper is loaded
Lazy = { deps = ["Helper"], autoload = true }

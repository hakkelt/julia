manifest_format = "2.0"

[[deps.App]]
path = "../App"
uuid = "44444444-4444-4444-4444-444444444444"
version = "0.1.0"
deps = ["Solvers"]

    [deps.App.subdeps]
    Solvers = ["Tsit5"]

[[deps.SyntaxApp]]
path = "../SyntaxApp"
uuid = "66666666-6666-6666-6666-666666666666"
version = "0.1.0"
deps = ["Solvers"]

    [deps.SyntaxApp.syntax]
    julia_version = "1.15.0"

    [deps.SyntaxApp.subdeps]
    Solvers = ["Common", "Tsit5"]

[[deps.Solvers]]
path = "../Solvers"
uuid = "11111111-1111-1111-1111-111111111111"
version = "1.2.3"
deps = ["Light"]
weakdeps = ["Heavy", "Helper"]

    [deps.Solvers.subpackages]
    Common = []
    Tsit5 = ["Common"]
    BDF = { deps = ["Common", "Heavy"] }
    Plots = { deps = ["BDF"], autoload = true }
    Recipes = { deps = ["Common", "Heavy", "Helper"], autoload = ["Heavy"] }
    Lazy = { deps = ["Helper"], autoload = true }

[[deps.Light]]
path = "../Light"
uuid = "22222222-2222-2222-2222-222222222222"
version = "0.1.0"

[[deps.Heavy]]
path = "../Heavy"
uuid = "33333333-3333-3333-3333-333333333333"
version = "0.1.0"

[[deps.Helper]]
path = "../Helper"
uuid = "55555555-5555-5555-5555-555555555555"
version = "0.1.0"
